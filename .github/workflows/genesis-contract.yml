name: Genesis Contract Authority

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "test/**"
      - "policies/**"
      - "tenders/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/genesis-contract.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "policies/**"
      - "tenders/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/genesis-contract.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run policy:hash
      - run: npm run policy:verify
      - run: npm run tender:hash
      - run: npm run tender:verify
      - run: npm run compile
      - run: npm test
