name: Genesis Contract Authority

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "test/**"
      - "policies/**"
      - "tenders/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/genesis-contract.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "policies/**"
      - "tenders/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/genesis-contract.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run policy:hash
      - run: npm run policy:verify
      - run: npm run tender:hash
      - run: npm run tender:verify
      - run: npm run compile
      - run: node --check scripts/serve-genesis-mainnet-deployer.js
      - run: node --check scripts/verify-genesis-mainnet.js
      - run: node --check scripts/check-genesis-mainnet-bytecode.js
      - run: node --check scripts/check-genesis-verifier-canary.js
      - run: node --check src/genesisVerifierB/awsKmsSigner.js
      - run: node --check src/genesisSettlement/relayer.js
      - run: node --check src/genesisSettlement/encryptedRelayer.js
      - run: node --check scripts/create-genesis-relayer.js
      - run: node --check scripts/check-genesis-settlement-relayer.js
      - run: node --check scripts/run-genesis-relayer.js
      - run: node --check src/genesisIntake/submission.js
      - run: node --check src/genesisIntake/sandbox.js
      - run: node --check src/genesisIntake/index.js
      - run: node --check src/genesisIntake/github.js
      - run: node --check scripts/dry-run-genesis-issue.js
      - run: node --check scripts/run-genesis-autonomous.js
      - run: node --check scripts/check-genesis-intake-sandbox.js
      - run: node --check scripts/create-genesis-synthetic-issue.js
      - run: node --check scripts/check-genesis-public-discovery.js
      - run: npm run mainnet:public-discovery:verify
      - run: npm run intake:sandbox-canary
      - run: node --check scripts/export-genesis-verification-bundle.js
      - run: npm test
